<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoonCircle</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>
  <main id="main" class="container">
    <h1>Home</h1>

    <form id="composer" class="composer" hidden>
      <label class="sr-only" for="post-text">Write a post</label>
      <textarea id="post-text" rows="3" maxlength="280" placeholder="What's happening?"></textarea>
      <div class="composer-row">
        <span id="counter" class="muted" aria-live="polite">280 characters left</span>
        <button id="post-submit" class="btn btn-primary" type="submit">Post</button>
      </div>
      <p id="composer-notice" class="notice" role="status" aria-live="polite"></p>
    </form>
    <p id="invite" class="muted" hidden><a href="/login.html">Log in</a> to share a post.</p>

    <h2>Latest posts</h2>
    <p id="status" class="status" role="status">Loading posts...</p>
    <ul id="posts" class="post-list"></ul>
    <button id="more" class="btn btn-secondary" type="button" hidden>Load more</button>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script type="module" src="/js/layout.js"></script>
  <script type="module" src="/js/feed.js"></script>
</body>
</html>
