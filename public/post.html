<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post | MoonCircle</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>
  <main id="main" class="container">
    <a class="back" href="/">&larr; Back to feed</a>
    <h1>Post</h1>
    <p id="status" class="status" role="status">Loading post...</p>
    <ul id="post" class="post-list"></ul>

    <section id="comments-section" hidden>
      <h2 id="comments-title">Comments</h2>

      <form id="comment-form" class="composer" hidden>
        <label class="sr-only" for="comment-text">Write a comment</label>
        <textarea id="comment-text" rows="2" maxlength="200" placeholder="Write a comment"></textarea>
        <div class="composer-row">
          <span id="counter" class="muted" aria-live="polite">200 characters left</span>
          <button id="comment-submit" class="btn btn-primary" type="submit">Comment</button>
        </div>
        <p id="comment-notice" class="notice" role="status" aria-live="polite"></p>
      </form>
      <p id="invite" class="muted" hidden><a href="/login.html">Log in</a> to comment.</p>

      <p id="empty" class="status" hidden>No comments yet.</p>
      <ul id="comments" class="comment-list"></ul>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script type="module" src="/js/layout.js"></script>
  <script type="module" src="/js/post-page.js"></script>
</body>
</html>s
